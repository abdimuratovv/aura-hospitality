# Render Blueprint for AURA Hospitality.
# https://render.com/docs/blueprint-spec
#
# Deploys two services from this one repo:
#   1. aura-dashboard  - the Next.js 16 app (aura-next/), the live product.
#   2. aura-ai-service - the Python/FastAPI fraud-detection service (ai-service/).
#      Optional: the dashboard works without it, this only powers the
#      rule-based Fraud Detection AI job. Remove this service block if you
#      only want the dashboard live for now.
#
# Both connect to the SAME external Neon Postgres database - there is no
# Render-managed database here, DATABASE_URL must be set manually on each
# service (see the sync: false vars below).
#
# After creating the Blueprint in the Render dashboard, you MUST set these
# manually per service (Render can't read them from this file, they're
# gitignored secrets - copy from aura-next/.env.local / ai-service/.env):
#   aura-dashboard:  DATABASE_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   aura-ai-service: DATABASE_URL
# SESSION_SECRET is auto-generated by Render on first deploy (generateValue: true).
#
# Before the first deploy (or after any schema.prisma change), run migrations
# against the Neon database once - Render's preDeployCommand below handles
# this automatically on every deploy, but you can also run it manually from
# aura-next/: npx prisma migrate deploy

services:
  - type: web
    name: aura-dashboard
    runtime: node
    plan: free
    region: singapore # closest Render region to Neon's ap-southeast-1
    rootDir: aura-next
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: web
    name: aura-ai-service
    runtime: python
    plan: free
    region: singapore
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
